# Serves the VOD media volume (HLS playlists, segments, thumbnails).
# Playlists are no-cache (they can be regenerated); segments/thumbs are
# immutable and cached hard. CORS is open so the SPA player can fetch
# cross-origin from the Vite dev server.

map $uri $media_cache {
    default            "public, max-age=31536000, immutable";
    ~*\.m3u8$          "no-cache";
}

server {
    listen 80;
    server_name _;
    root /srv/media;

    location / {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
            image/jpeg                    jpg jpeg;
        }

        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers  "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Cache-Control                 $media_cache always;

        if ($request_method = OPTIONS) { return 204; }

        try_files $uri =404;
    }
}
